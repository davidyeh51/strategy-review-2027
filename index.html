async function open(pw){
 const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
 return new TextDecoder().decode(pt);
}
async function go(pw,remember){
 try{const html=await open(pw);
  try{if(remember)sessionStorage.setItem('k',pw);}catch(e){}
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('e').textContent='通行碼不正確，請再試一次。';try{sessionStorage.removeItem('k');}catch(_){}}
}
